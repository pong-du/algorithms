<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달빛 딕싯 온라인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #1c1638;
    --panel: #2a2152;
    --panel-2: #352a63;
    --line: #453a78;
    --ink: #e9e3f7;
    --ink-dim: #a49bcd;
    --gold: #f0c674;
    --rose: #dd8fa8;
    --cream: #f6efdf;
    --good: #8fd7a8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
    touch-action: manipulation;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h1, h2, .serif {
    font-family: "Gowun Batang", "Noto Serif KR", serif;
    text-wrap: balance;
    margin: 0;
  }
  h1 { font-size: 30px; font-weight: 700; }
  h2 { font-size: 21px; font-weight: 700; }
  p { margin: 0; }
  .dim { color: var(--ink-dim); }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
  }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .stack-lg { display: flex; flex-direction: column; gap: 22px; }

  button { font: inherit; color: inherit; border: none; cursor: pointer; background: none; padding: 0; }
  .btn {
    display: block;
    width: 100%;
    padding: 15px 18px;
    border-radius: 14px;
    background: var(--gold);
    color: #241a08;
    font-weight: 700;
    font-size: 17px;
    text-align: center;
    transition: transform .08s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { background: var(--line); color: var(--ink-dim); }
  .btn-ghost { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); }
  .btn:focus-visible, .card-slot:focus-visible, input:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  input[type="text"] {
    font: inherit;
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
  }
  input[type="text"]::placeholder { color: var(--ink-dim); }
  input.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 700; text-align: center; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }

  .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card-slot {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid var(--line);
    background: var(--panel);
    transition: transform .08s ease;
    display: block;
    width: 100%;
  }
  .card-slot:active { transform: scale(.97); }
  .card-slot.selected { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(240,198,116,.35); }
  .card-slot svg { display: block; width: 100%; height: auto; }
  .card-tag {
    position: absolute; left: 8px; bottom: 8px;
    padding: 3px 9px; border-radius: 999px;
    background: rgba(20,14,44,.78); color: var(--cream);
    font-size: 12px; font-weight: 500;
  }
  .card-tag.owner-st { background: rgba(240,198,116,.92); color: #241a08; font-weight: 700; }

  #overlay[hidden] { display: none !important; }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(12,8,28,.86);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  #overlay .big-card { width: min(78vw, 320px, 52vh); border-radius: 16px; overflow: hidden; border: 2px solid var(--gold); }
  #overlay .big-card svg { display: block; width: 100%; height: auto; }
  #overlay .row { display: flex; gap: 12px; width: min(78vw, 320px); }
  #overlay .row .btn { flex: 1; }

  .score-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .score-row:last-child { border-bottom: none; }
  .score-row .name { flex: 1; font-weight: 500; }
  .score-row .pts { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 18px; }
  .score-row .delta { color: var(--good); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; }
  .crown { color: var(--gold); }

  .clue-banner { text-align: center; padding: 18px 16px; border-radius: 16px; background: var(--panel-2); border: 1px solid var(--line); }
  .clue-banner .clue-text { font-family: "Gowun Batang", serif; font-size: 22px; font-weight: 700; color: var(--gold); text-wrap: balance; }

  .center-screen {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 18px; min-height: 60vh;
  }
  .moon-mark { width: 110px; height: 110px; }
  .moon-mark.small { width: 72px; height: 72px; }
  .breathe { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }

  .room-code-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);
    font-weight: 700; letter-spacing: .25em; font-size: 20px;
    font-variant-numeric: tabular-nums;
  }
  .lobby-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .lobby-row:last-child { border-bottom: none; }
  .lobby-row .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #241a08; flex-shrink: 0;
  }
  .lobby-row .who { flex: 1; font-weight: 500; }
  .badge {
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
  }
  .badge.gold { background: var(--gold); border-color: var(--gold); color: #241a08; }
  .badge.done { background: rgba(143,215,168,.16); border-color: rgba(143,215,168,.5); color: var(--good); }

  .vote-chips { display: flex; flex-wrap: wrap; gap: 4px; position: absolute; top: 6px; left: 6px; right: 6px; }
  .vote-chip { padding: 2px 8px; border-radius: 999px; background: rgba(221,143,168,.92); color: #3a1220; font-size: 11px; font-weight: 700; }
  .hit-badge {
    position: absolute; top: 6px; right: 6px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--gold); color: #241a08; font-size: 12px; font-weight: 700;
  }
  .reveal-note { font-size: 13px; color: var(--ink-dim); padding-top: 4px; }

  details.rules { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  details.rules summary { padding: 13px 16px; cursor: pointer; font-weight: 500; list-style: none; }
  details.rules summary::-webkit-details-marker { display: none; }
  details.rules summary::after { content: "＋"; float: right; color: var(--ink-dim); }
  details.rules[open] summary::after { content: "−"; }
  details.rules .rules-body { padding: 0 16px 16px; color: var(--ink-dim); font-size: 14px; display: flex; flex-direction: column; gap: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink); padding: 10px 18px; border-radius: 999px;
    font-size: 14px; z-index: 20; white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" hidden></div>

<script>
"use strict";

/* ---------- 시드 난수 ---------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
function rand(rng, min, max) { return min + rng() * (max - min); }

/* ---------- 카드 아트 생성 (200x300 SVG) ---------- */
const SKIES = [
  ["#241a54", "#5b3a8f", "#c86f9b"],
  ["#0d1b3d", "#1f3b73", "#3f6fa8"],
  ["#3f1a3c", "#8f3b6b", "#e0879b"],
  ["#0f3a3f", "#1f6b63", "#63a68f"],
  ["#4a2a12", "#a8632b", "#f0c674"],
  ["#1a1240", "#3a2a75", "#7e5aa8"],
];

function stars(rng, n) {
  let s = "";
  for (let i = 0; i < n; i++) {
    const x = rand(rng, 8, 192), y = rand(rng, 8, 170);
    const r = rand(rng, 0.7, 1.9);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#fff" opacity="${rand(rng, .35, .9).toFixed(2)}"/>`;
  }
  return s;
}
function cloud(rng, x, y, w, color, op) {
  return `<g fill="${color}" opacity="${op}">
    <ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w * .34}"/>
    <ellipse cx="${x - w * .5}" cy="${y + 3}" rx="${w * .55}" ry="${w * .22}"/>
    <ellipse cx="${x + w * .55}" cy="${y + 2}" rx="${w * .5}" ry="${w * .2}"/>
  </g>`;
}
function hills(rng, base, color) {
  const y1 = 300 - base, r1 = rand(rng, 70, 130), x1 = rand(rng, 20, 90);
  const r2 = rand(rng, 60, 110), x2 = rand(rng, 110, 185);
  return `<g fill="${color}">
    <circle cx="${x1}" cy="${300 + r1 - base}" r="${r1 + base * .6}"/>
    <circle cx="${x2}" cy="${300 + r2 - base + 12}" r="${r2 + base * .5}"/>
    <rect x="0" y="${y1 + 40}" width="200" height="${base + 40}"/>
  </g>`;
}
function sea(rng, base, color) {
  let waves = "";
  for (let i = 0; i < 4; i++) {
    const y = 300 - base + 12 + i * 14;
    waves += `<path d="M0 ${y} Q 25 ${y - 5} 50 ${y} T 100 ${y} T 150 ${y} T 200 ${y}" stroke="#ffffff" stroke-width="1.4" fill="none" opacity="${(0.35 - i * 0.06).toFixed(2)}"/>`;
  }
  return `<rect x="0" y="${300 - base}" width="200" height="${base}" fill="${color}"/>${waves}`;
}

const MOTIFS = [
  function moonLadder(rng, c) { // 달과 사다리
    const mx = rand(rng, 70, 130), my = rand(rng, 60, 100), r = rand(rng, 34, 46);
    let rungs = "";
    const lx = mx - 8, topY = my + r - 6, botY = 288;
    for (let y = topY + 14; y < botY; y += 16) rungs += `<line x1="${lx - 7}" y1="${y}" x2="${lx + 7}" y2="${y}"/>`;
    return `<circle cx="${mx}" cy="${my}" r="${r}" fill="${c.glow}"/>
      <circle cx="${mx - r * .3}" cy="${my - r * .2}" r="${r * .16}" fill="#00000018"/>
      <circle cx="${mx + r * .25}" cy="${my + r * .3}" r="${r * .11}" fill="#00000015"/>
      <g stroke="${c.dark}" stroke-width="3" stroke-linecap="round">
        <line x1="${lx - 7}" y1="${topY}" x2="${lx - 7}" y2="${botY}"/>
        <line x1="${lx + 7}" y1="${topY}" x2="${lx + 7}" y2="${botY}"/>${rungs}</g>`;
  },
  function balloon(rng, c) { // 열기구
    const bx = rand(rng, 60, 140), by = rand(rng, 70, 110), r = rand(rng, 30, 40);
    const basketY = by + r + 26;
    return `<circle cx="${bx}" cy="${by}" r="${r}" fill="${c.warm}"/>
      <path d="M${bx - r} ${by} A ${r} ${r} 0 0 1 ${bx + r} ${by}" fill="#ffffff2a"/>
      <ellipse cx="${bx}" cy="${by}" rx="${r * .45}" ry="${r}" fill="#00000022"/>
      <line x1="${bx - r * .6}" y1="${by + r * .75}" x2="${bx - 8}" y2="${basketY}" stroke="${c.dark}" stroke-width="2"/>
      <line x1="${bx + r * .6}" y1="${by + r * .75}" x2="${bx + 8}" y2="${basketY}" stroke="${c.dark}" stroke-width="2"/>
      <rect x="${bx - 10}" y="${basketY}" width="20" height="14" rx="3" fill="${c.dark}"/>`;
  },
  function whale(rng, c) { // 하늘 고래
    const wx = rand(rng, 85, 115), wy = rand(rng, 120, 170), s = rand(rng, .8, 1.15);
    return `<g transform="translate(${wx} ${wy}) scale(${s.toFixed(2)})">
      <ellipse cx="0" cy="0" rx="62" ry="26" fill="${c.cool}"/>
      <path d="M56 -4 L86 -22 L80 2 L88 20 L58 8 Z" fill="${c.cool}"/>
      <ellipse cx="-6" cy="10" rx="50" ry="13" fill="#ffffff30"/>
      <circle cx="-38" cy="-6" r="3.4" fill="#141031"/>
      <circle cx="-52" cy="-34" r="3" fill="#ffffffaa"/>
      <circle cx="-46" cy="-46" r="4.4" fill="#ffffff88"/>
      <circle cx="-56" cy="-56" r="5.5" fill="#ffffff66"/>
    </g>`;
  },
  function lonelyDoor(rng, c) { // 홀로 선 문
    const dx = rand(rng, 75, 125), dy = 176;
    return `<ellipse cx="${dx}" cy="${dy + 86}" rx="52" ry="12" fill="#00000030"/>
      <rect x="${dx - 30}" y="${dy - 10}" width="60" height="96" rx="6" fill="${c.dark}"/>
      <rect x="${dx - 22}" y="${dy - 2}" width="44" height="80" rx="4" fill="${c.glow}"/>
      <circle cx="${dx + 13}" cy="${dy + 40}" r="3.2" fill="${c.dark}"/>
      <line x1="${dx}" y1="${dy - 2}" x2="${dx}" y2="${dy + 78}" stroke="${c.dark}" stroke-width="2" opacity=".5"/>`;
  },
  function skyStairs(rng, c) { // 하늘 계단
    let steps = "";
    let x = rand(rng, 18, 40), y = 268;
    for (let i = 0; i < 8; i++) {
      steps += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="42" height="12" rx="3" fill="${c.dark}" opacity="${(1 - i * 0.07).toFixed(2)}"/>`;
      x += rand(rng, 12, 20); y -= 26;
    }
    return steps + `<circle cx="${x + 26}" cy="${y + 4}" r="17" fill="${c.glow}"/>`;
  },
  function paperBoat(rng, c) { // 종이배
    const bx = rand(rng, 70, 130), by = rand(rng, 200, 232);
    return `<g transform="translate(${bx} ${by})">
      <path d="M-40 0 L40 0 L22 20 L-22 20 Z" fill="${c.warm}"/>
      <path d="M0 -30 L20 0 L-20 0 Z" fill="#ffffffd8"/>
      <path d="M0 -30 L0 0 L-20 0 Z" fill="#ffffffa8"/>
      <circle cx="0" cy="-40" r="5" fill="${c.glow}"/>
    </g>`;
  },
  function lanternTree(rng, c) { // 등불 나무
    const tx = rand(rng, 80, 120);
    let dots = "";
    for (let i = 0; i < 7; i++) {
      dots += `<circle cx="${(tx + rand(rng, -38, 38)).toFixed(0)}" cy="${rand(rng, 110, 165).toFixed(0)}" r="${rand(rng, 3, 5.4).toFixed(1)}" fill="${c.glow}"/>`;
    }
    return `<path d="M${tx - 5} 268 L${tx - 9} 180 L${tx + 9} 180 L${tx + 5} 268 Z" fill="${c.dark}"/>
      <circle cx="${tx}" cy="140" r="46" fill="${c.cool}" opacity=".92"/>
      <circle cx="${tx - 30}" cy="160" r="26" fill="${c.cool}" opacity=".8"/>
      <circle cx="${tx + 32}" cy="156" r="24" fill="${c.cool}" opacity=".8"/>${dots}`;
  },
  function jellyfish(rng, c) { // 해파리
    const jx = rand(rng, 75, 125), jy = rand(rng, 90, 130), r = rand(rng, 30, 40);
    let legs = "";
    for (let i = -2; i <= 2; i++) {
      const lx = jx + i * (r * .34);
      legs += `<path d="M${lx} ${jy + 6} q 7 26 -4 48 q -8 20 3 40" stroke="${c.glow}" stroke-width="2.6" fill="none" opacity=".8"/>`;
    }
    return `<path d="M${jx - r} ${jy} A ${r} ${r} 0 0 1 ${jx + r} ${jy} Q ${jx + r * .6} ${jy + 12} ${jx} ${jy + 8} Q ${jx - r * .6} ${jy + 12} ${jx - r} ${jy} Z" fill="${c.warm}" opacity=".95"/>
      <path d="M${jx - r * .6} ${jy - r * .3} A ${r * .8} ${r * .8} 0 0 1 ${jx + r * .5} ${jy - r * .5}" stroke="#ffffff66" stroke-width="4" fill="none"/>${legs}`;
  },
  function lighthouse(rng, c) { // 등대
    const lx = rand(rng, 80, 120);
    return `<polygon points="${lx - 16},262 ${lx + 16},262 ${lx + 10},150 ${lx - 10},150" fill="${c.warm}"/>
      <rect x="${lx - 16}" y="196" width="32" height="12" fill="${c.dark}" opacity=".55"/>
      <rect x="${lx - 16}" y="228" width="32" height="12" fill="${c.dark}" opacity=".55"/>
      <rect x="${lx - 12}" y="134" width="24" height="16" rx="3" fill="${c.dark}"/>
      <circle cx="${lx}" cy="142" r="6" fill="${c.glow}"/>
      <polygon points="${lx + 8},136 196,110 196,168" fill="${c.glow}" opacity=".28"/>
      <polygon points="${lx - 8},136 4,112 4,166" fill="${c.glow}" opacity=".2"/>`;
  },
  function eyeMoon(rng, c) { // 하늘의 눈
    const ex = rand(rng, 75, 125), ey = rand(rng, 80, 115);
    let lash = "";
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI * (0.18 + 0.64 * i / 6);
      const x1 = ex + Math.cos(a) * 46, y1 = ey + Math.sin(a) * 27;
      const x2 = ex + Math.cos(a) * 58, y2 = ey + Math.sin(a) * 38;
      lash += `<line x1="${x1.toFixed(0)}" y1="${y1.toFixed(0)}" x2="${x2.toFixed(0)}" y2="${y2.toFixed(0)}" stroke="${c.glow}" stroke-width="2.4" stroke-linecap="round"/>`;
    }
    return `<ellipse cx="${ex}" cy="${ey}" rx="46" ry="27" fill="${c.cream || "#f6efdf"}"/>
      <circle cx="${ex}" cy="${ey}" r="16" fill="${c.cool}"/>
      <circle cx="${ex}" cy="${ey}" r="7" fill="#141031"/>
      <circle cx="${ex + 4}" cy="${ey - 5}" r="3" fill="#ffffffcc"/>${lash}`;
  },
  function umbrellaRain(rng, c) { // 우산과 별비
    const ux = rand(rng, 75, 125), uy = rand(rng, 130, 160);
    let drops = "";
    for (let i = 0; i < 10; i++) {
      const x = rand(rng, 15, 185), y = rand(rng, 20, uy - 44);
      drops += `<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x - 5).toFixed(0)}" y2="${(y + 13).toFixed(0)}" stroke="${c.glow}" stroke-width="2" stroke-linecap="round" opacity=".75"/>`;
    }
    return `${drops}<path d="M${ux - 52} ${uy} A 52 52 0 0 1 ${ux + 52} ${uy} Z" fill="${c.warm}"/>
      <path d="M${ux - 52} ${uy} A 52 52 0 0 1 ${ux} ${uy - 52} L ${ux} ${uy} Z" fill="#ffffff26"/>
      <path d="M${ux} ${uy} L ${ux} ${uy + 74} q 0 12 12 12" stroke="${c.dark}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
  },
  function islandFloat(rng, c) { // 떠 있는 섬
    const ix = rand(rng, 80, 120), iy = rand(rng, 120, 150);
    return `<polygon points="${ix - 52},${iy} ${ix + 52},${iy} ${ix + 20},${iy + 52} ${ix - 26},${iy + 44}" fill="${c.dark}"/>
      <ellipse cx="${ix}" cy="${iy}" rx="52" ry="13" fill="${c.cool}"/>
      <path d="M${ix - 8} ${iy - 4} L${ix - 11} ${iy - 40} L${ix - 3} ${iy - 40} L${ix - 6} ${iy - 4} Z" fill="${c.dark}"/>
      <circle cx="${ix - 7}" cy="${iy - 52}" r="17" fill="${c.warm}"/>
      <circle cx="${ix + 30}" cy="${iy + 62}" r="4" fill="${c.glow}" opacity=".7"/>
      <circle cx="${ix - 38}" cy="${iy + 70}" r="3" fill="${c.glow}" opacity=".55"/>`;
  },
];

function cardArt(id, w) {
  const rng = mulberry32(id * 7919 + 13);
  const sky = pick(rng, SKIES);
  const palette = {
    glow: pick(rng, ["#f6e7b2", "#ffe9c9", "#f9f2d9", "#ffdfa6"]),
    warm: pick(rng, ["#e0879b", "#f0a05e", "#dd8fa8", "#e8b04f", "#d9788f"]),
    cool: pick(rng, ["#5a7fc0", "#63a68f", "#7e5aa8", "#4f8fa8", "#8a6fc0"]),
    dark: "#20183f",
    cream: "#f6efdf",
  };
  const motif = pick(rng, MOTIFS);
  const groundKind = rng();
  let ground = "";
  if (groundKind < 0.45) ground = hills(rng, rand(rng, 40, 70), "#20183f");
  else if (groundKind < 0.8) ground = sea(rng, rand(rng, 45, 75), "#1b2e57");
  const gid = "sky" + id;
  return `<svg viewBox="0 0 200 300" role="img" aria-label="카드 ${id}"${w ? ` width="${w}"` : ""}>
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sky[0]}"/><stop offset=".55" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[2]}"/>
    </linearGradient></defs>
    <rect width="200" height="300" fill="url(#${gid})"/>
    ${stars(rng, Math.floor(rand(rng, 8, 22)))}
    ${rng() < 0.6 ? cloud(rng, rand(rng, 30, 170), rand(rng, 25, 70), rand(rng, 18, 34), "#ffffff", rand(rng, .12, .3).toFixed(2)) : ""}
    ${ground}
    ${motif(rng, palette)}
  </svg>`;
}

/* ---------- 상수 ---------- */
const DECK_SIZE = 84;
const HAND_SIZE = 6;
const WIN_SCORE = 30;
const MIN_PLAYERS = 3;
const MAX_PLAYERS = 6;
const LS_KEY = "dixit-online-v1";
const AVATAR_COLORS = ["#f0c674", "#dd8fa8", "#8fd7a8", "#7fb3e8", "#c9a0f0", "#f0a05e"];

/* ---------- 로컬 상태 ---------- */
let db = null;
let L = { pid: null, name: "", room: null };   // 내 정보
let M = null;          // rooms/<code> 메인 문서
let LOBBY = [];        // players 컬렉션 [{id, name, joinedAt}]
let SUBS = {};         // pid → {round, card}
let VOTES = {};        // pid → {round, card}
let unsubs = [];
let lastRenderKey = "";
let homeMsg = "";

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s.pid === "string") L = { pid: s.pid, name: s.name || "", room: s.room || null };
    }
  } catch (e) {}
  if (!L.pid) {
    L.pid = "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  }
  saveLocal();
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(L)); } catch (e) {}
}

/* ---------- db 경로 ---------- */
const roomDoc = code => db.doc("rooms/" + code);
const playersCol = code => db.collection("rooms/" + code + "/players");
const subDoc = (code, pid) => db.doc("rooms/" + code + "/subs/" + pid);
const votesCol = code => db.collection("rooms/" + code + "/votes");
const subsCol = code => db.collection("rooms/" + code + "/subs");
const voteDoc = (code, pid) => db.doc("rooms/" + code + "/votes/" + pid);

/* ---------- 유틸 ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function makeCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
function avatarColor(pid) {
  let h = 0;
  for (const ch of pid) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}

function moonMark(small, breathe) {
  return `<svg class="moon-mark${small ? " small" : ""}${breathe ? " breathe" : ""}" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="44" fill="#f0c674"/>
    <circle cx="46" cy="50" r="8" fill="#00000018"/>
    <circle cx="70" cy="72" r="6" fill="#00000014"/>
    <circle cx="93" cy="28" r="3" fill="#e9e3f7"/>
    <circle cx="20" cy="34" r="2.2" fill="#e9e3f7"/>
    <circle cx="102" cy="86" r="2.4" fill="#e9e3f7"/>
  </svg>`;
}

/* ---------- 게임 도우미 ---------- */
const stPid = () => M.players[M.storyteller].id;
const me = () => M && M.players.find(p => p.id === L.pid);
const isSt = () => M && stPid() === L.pid;
const nonStPlayers = () => M.players.filter(p => p.id !== stPid());
const playerName = pid => {
  const p = (M ? M.players : LOBBY).find(x => x.id === pid);
  return p ? p.name : "?";
};
function subsThisRound() {
  const out = {};
  for (const p of nonStPlayers()) {
    const s = SUBS[p.id];
    if (s && s.round === M.round) out[p.id] = s.card;
  }
  return out;
}
function votesThisRound() {
  const out = {};
  for (const p of nonStPlayers()) {
    const v = VOTES[p.id];
    if (v && v.round === M.round) out[p.id] = v.card;
  }
  return out;
}

/* ---------- 상태 전환 (아무 클라이언트나 lease를 잡고 수행) ---------- */
let advancing = false;
async function tryTransition(expectPhase, expectRound, compute, retries = 0) {
  if (advancing) return;
  advancing = true;
  let retry = false;
  try {
    const ref = roomDoc(L.room);
    const lock = await ref.acquire({ holder: L.pid, ttlMs: 1500 });
    if (!lock.acquired) { retry = true; return; }
    const snap = await ref.get();
    const g = snap.exists ? snap.data() : null;
    if (!g || g.status !== "playing" || g.phase !== expectPhase || g.round !== expectRound) return;
    const next = compute(g);
    if (next) await ref.set(next);
  } catch (e) {
    retry = true;
  } finally {
    advancing = false;
    if (retry) {
      // 다른 클라이언트가 lease를 잡고 있거나 일시 오류 — 잠시 후 같은 전환을 재시도
      if (retries > 0) setTimeout(() => tryTransition(expectPhase, expectRound, compute, retries - 1), 1600);
      else setTimeout(checkAdvance, 2000);
    }
  }
}

function checkAdvance() {
  if (!M || M.status !== "playing") return;
  if (M.phase === "pick") {
    const subs = subsThisRound();
    if (Object.keys(subs).length === nonStPlayers().length) {
      tryTransition("pick", M.round, g => {
        // g 기준으로 다시 검증
        const st = g.players[g.storyteller].id;
        const need = g.players.filter(p => p.id !== st);
        const cards = [g.stCard];
        const hands = {};
        for (const p of need) {
          const c = subs[p.id];
          if (c == null) return null;
          cards.push(c);
          hands[p.id] = g.hands[p.id].filter(x => x !== c);
        }
        const subsMap = { ...subs };
        subsMap[st] = g.stCard;
        return { ...g, phase: "vote", tableOrder: shuffle(cards), subsMap, hands: { ...g.hands, ...hands } };
      });
    }
  } else if (M.phase === "vote") {
    const votes = votesThisRound();
    if (Object.keys(votes).length === nonStPlayers().length) {
      tryTransition("vote", M.round, g => {
        const st = g.players[g.storyteller].id;
        const voters = g.players.filter(p => p.id !== st).map(p => p.id);
        if (voters.some(v => votes[v] == null)) return null;
        const correct = voters.filter(v => votes[v] === g.stCard);
        const deltas = {};
        g.players.forEach(p => { deltas[p.id] = 0; });
        if (correct.length === 0 || correct.length === voters.length) {
          voters.forEach(v => { deltas[v] += 2; });
        } else {
          deltas[st] += 3;
          correct.forEach(v => { deltas[v] += 3; });
        }
        for (const [pid, card] of Object.entries(g.subsMap)) {
          if (pid === st) continue;
          deltas[pid] += voters.filter(v => votes[v] === card).length;
        }
        const scores = { ...g.scores };
        for (const pid of Object.keys(deltas)) scores[pid] = (scores[pid] || 0) + deltas[pid];
        return { ...g, phase: "reveal", result: { votes: { ...votes }, deltas }, scores };
      });
    }
  }
}

function nextRoundState(g) {
  const someoneWon = g.players.some(p => (g.scores[p.id] || 0) >= WIN_SCORE);
  const canRefill = g.deck.length >= g.players.length;
  if (someoneWon || !canRefill) {
    return { ...g, status: "end" };
  }
  const deck = g.deck.slice();
  const hands = { ...g.hands };
  for (const p of g.players) hands[p.id] = [...hands[p.id], deck.pop()];
  return {
    ...g,
    deck, hands,
    round: g.round + 1,
    storyteller: (g.storyteller + 1) % g.players.length,
    phase: "story",
    clue: "", stCard: null, tableOrder: [], subsMap: {}, result: null,
  };
}

function freshGameState(players, host) {
  const deck = shuffle(Array.from({ length: DECK_SIZE }, (_, i) => i + 1));
  const hands = {}, scores = {};
  for (const p of players) { hands[p.id] = deck.splice(0, HAND_SIZE); scores[p.id] = 0; }
  return {
    status: "playing", host,
    players: players.map(p => ({ id: p.id, name: p.name })),
    round: 1, storyteller: 0, phase: "story",
    deck, hands, scores,
    clue: "", stCard: null, tableOrder: [], subsMap: {}, result: null,
    startedAt: Date.now(),
  };
}

/* ---------- 방 입장/구독 ---------- */
function clearSubs() {
  unsubs.forEach(u => { try { u(); } catch (e) {} });
  unsubs = [];
  M = null; LOBBY = []; SUBS = {}; VOTES = {};
}

function watchRoom(code) {
  clearSubs();
  L.room = code;
  saveLocal();
  unsubs.push(roomDoc(code).onSnapshot(snap => {
    M = snap.exists ? snap.data() : null;
    if (!M) { leaveRoom("방이 사라졌어요."); return; }
    checkAdvance();
    render();
  }, () => { toast("연결에 문제가 생겼어요. 새로고침 해주세요."); }));
  unsubs.push(playersCol(code).onSnapshot(snap => {
    LOBBY = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
    LOBBY.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    render();
  }));
  unsubs.push(subsCol(code).onSnapshot(snap => {
    SUBS = {};
    snap.docs.forEach(d => { if (d.exists) SUBS[d.id] = d.data(); });
    checkAdvance();
    render();
  }));
  unsubs.push(votesCol(code).onSnapshot(snap => {
    VOTES = {};
    snap.docs.forEach(d => { if (d.exists) VOTES[d.id] = d.data(); });
    checkAdvance();
    render();
  }));
}

async function createRoom(name) {
  L.name = name; saveLocal();
  for (let attempt = 0; attempt < 5; attempt++) {
    const code = makeCode();
    const ref = roomDoc(code);
    const snap = await ref.get();
    if (snap.exists) continue;
    await ref.set({ status: "lobby", host: L.pid, createdAt: Date.now() });
    await playersCol(code).doc(L.pid).set({ name, joinedAt: Date.now() });
    watchRoom(code);
    render();
    return;
  }
  toast("방 만들기에 실패했어요. 다시 시도해 주세요.");
}

async function joinRoom(name, code) {
  L.name = name; saveLocal();
  const snap = await roomDoc(code).get();
  if (!snap.exists) { homeMsg = "코드 " + code + " 방을 찾을 수 없어요."; render(); return; }
  const g = snap.data();
  const already = g.players && g.players.some(p => p.id === L.pid);
  if (g.status === "lobby") {
    const lobbySnap = await playersCol(code).get();
    const count = lobbySnap.docs.filter(d => d.exists).length;
    const inLobby = lobbySnap.docs.some(d => d.id === L.pid);
    if (!inLobby && count >= MAX_PLAYERS) { homeMsg = "방이 가득 찼어요 (최대 " + MAX_PLAYERS + "명)."; render(); return; }
    await playersCol(code).doc(L.pid).set({ name, joinedAt: Date.now() });
  } else if (!already) {
    homeMsg = "이미 게임이 시작된 방이에요. 관전만 할 수 있어요.";
  }
  watchRoom(code);
  render();
}

function leaveRoom(msg) {
  clearSubs();
  L.room = null; saveLocal();
  if (msg) homeMsg = msg;
  render();
}

async function startGame() {
  const ref = roomDoc(L.room);
  const lock = await ref.acquire({ holder: L.pid, ttlMs: 1500 });
  if (!lock.acquired) { toast("잠시 후 다시 눌러주세요."); return; }
  const snap = await ref.get();
  if (!snap.exists || snap.data().status !== "lobby") return;
  const players = LOBBY.slice(0, MAX_PLAYERS);
  if (players.length < MIN_PLAYERS) return;
  await ref.set(freshGameState(shuffle(players.slice()), snap.data().host));
}

/* ---------- 렌더링 ---------- */
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");

function showPreview(cardId, confirmLabel, onConfirm) {

function cardGridHTML(cards, tagFn, extraFn) {

function scoreBoardHTML(deltas) {

      ${deltas && deltas[p.id] ? `<span class="delta">+${deltas[p.id]}</span>` : ""}
      <span class="pts">${M.scores[p.id] || 0}</span>

}

function headerHTML(sub) {
  return `<header class="stack" style="gap:8px">

      <p class="eyebrow" style="flex:1">라운드 ${M.round} · ${sub}</p>
      <span class="badge">${esc(L.room)}</span>

}

function progressHTML(doneMap, people, doneLabel) {
  return `<div class="panel">${people.map(p => `
    <div class="lobby-row">
      <span class="avatar" style="background:${avatarColor(p.id)}">${esc(p.name[0] || "?")}</span>
      <span class="who">${esc(p.name)}${p.id === L.pid ? ' <span class="dim">(나)</span>' : ""}</span>

    </div>`).join("")}

}

function render(html) {
  if (html !== undefined) { app.innerHTML = html; window.scrollTo(0, 0); return; }
  const view = pickView();
  if (view.key === lastRenderKey) return;
  lastRenderKey = view.key;
  overlay.hidden = true;
  app.innerHTML = view.html;
  view.bind && view.bind();
  window.scrollTo(0, 0);
}

/* 어떤 화면을 그릴지 결정 */
function pickView() {
  if (!db) return viewNoDb();
  if (!L.room) return viewHome();
  if (!M) return { key: "loading", html: `<div class="center-screen">${moonMark(false, true)}<p class="dim">불러오는 중…</p></div>` };
  if (M.status === "lobby") return viewLobby();
  if (M.status === "end") return viewEnd();
  if (!me()) return viewSpectator();
  switch (M.phase) {
    case "story": return isSt() ? viewStoryPick() : viewWaitStory();
    case "pick": {
      const mine = SUBS[L.pid];
      if (!isSt() && (!mine || mine.round !== M.round)) return viewPick();
      return viewWaitPick();
    }
    case "vote": {
      const mine = VOTES[L.pid];
      if (!isSt() && (!mine || mine.round !== M.round)) return viewVote();
      return viewWaitVote();
    }
    case "reveal": return viewReveal();
  }
  return viewHome();
}

function viewNoDb() {
  return {
    key: "nodb",
    html: `<div class="center-screen">
      ${moonMark()}
      <h1>달빛 딕싯 온라인</h1>

    </div>`,
  };
}

  return {

      </header>

      </div>
      <details class="rules">
        <summary>게임 방법</summary>
        <div class="rules-body">

        joinRoom(n, code).catch(() => toast("입장에 실패했어요."));
      };
    },

}

      </div>
      ${isHost ? `<button class="btn" id="start-btn" ${canStart ? "" : "disabled"}>게임 시작 (${count}명)</button>` : ""}
      <button class="btn btn-ghost" id="leave-btn">방 나가기</button>
    </div>`,
    bind() {
      const startBtn = document.getElementById("start-btn");
      if (startBtn) startBtn.onclick = () => startGame().catch(() => toast("시작에 실패했어요."));
      document.getElementById("leave-btn").onclick = async () => {
        try { await playersCol(L.room).doc(L.pid).delete(); } catch (e) {}
        leaveRoom();
      };
    },
  };
}

function viewSpectator() {
  return {
    key: "spec:" + M.phase + M.round,
    html: `<div class="stack-lg">
      ${headerHTML("관전 중")}
      <div class="clue-banner">
        ${M.clue ? `<p class="clue-text">“${esc(M.clue)}”</p>` : `<p class="dim">힌트를 기다리는 중…</p>`}
      </div>
      ${scoreBoardHTML(null)}
      <p class="dim" style="font-size:14px; text-align:center">게임이 이미 시작된 방이라 이번 판은 관전만 할 수 있어요.</p>
      <button class="btn btn-ghost" id="leave-btn">나가기</button>
    </div>`,
    bind() { document.getElementById("leave-btn").onclick = () => leaveRoom(); },
  };
}

function viewStoryPick() {
  const hand = M.hands[L.pid];
  return {
    key: "story-pick:" + M.round + ":" + hand.join(","),
    html: `<div class="stack-lg">
      ${headerHTML("이야기꾼은 나!")}
      <div class="stack">
        <h2>카드를 고르고 힌트를 정하세요</h2>
        <p class="dim" style="font-size:14px">카드를 누르면 크게 볼 수 있어요. 힌트는 너무 쉽지도, 너무 어렵지도 않게!</p>
      </div>
      ${cardGridHTML(hand)}
      <div class="panel stack" id="clue-box" hidden>
        <p class="dim" style="font-size:14px">고른 카드에 어울리는 힌트</p>
        <input type="text" id="clue-input" maxlength="40" placeholder="예: 끝나지 않는 여행">
        <button class="btn" id="clue-ok">힌트 공개</button>
      </div>
    </div>`,
    bind() {
      let chosen = null;
      const clueBox = document.getElementById("clue-box");
      document.querySelectorAll(".card-slot").forEach(el => {
        el.onclick = () => {
          const id = +el.dataset.card;
          showPreview(id, "이 카드로 결정", () => {
            chosen = id;
            document.querySelectorAll(".card-slot").forEach(s => s.classList.toggle("selected", +s.dataset.card === id));
            clueBox.hidden = false;
            clueBox.scrollIntoView({ behavior: "smooth", block: "center" });
            document.getElementById("clue-input").focus();
          });
        };
      });
      document.getElementById("clue-ok").onclick = async () => {
        const clue = document.getElementById("clue-input").value.trim();
        if (!chosen || !clue) return;
        const ref = roomDoc(L.room);
        const snap = await ref.get();
        const g = snap.exists ? snap.data() : null;
        if (!g || g.status !== "playing" || g.phase !== "story" || g.round !== M.round) return;
        await ref.set({
          ...g,
          clue, stCard: chosen, phase: "pick",
          hands: { ...g.hands, [L.pid]: g.hands[L.pid].filter(c => c !== chosen) },
        });
      };
    },
  };
}

function viewWaitStory() {
  return {
    key: "wait-story:" + M.round,
    html: `<div class="stack-lg">
      ${headerHTML("힌트 기다리는 중")}
      <div class="center-screen" style="min-height:40vh">
        ${moonMark(true, true)}
        <h2>${esc(playerName(stPid()))} 님이<br>힌트를 정하는 중이에요</h2>
        <p class="dim" style="font-size:14px">이야기꾼이 카드를 고르고 힌트를 공개하면 시작돼요.</p>
      </div>
      ${scoreBoardHTML(null)}
    </div>`,
  };
}

function viewPick() {
  const hand = M.hands[L.pid];
  return {
    key: "pick:" + M.round + ":" + hand.join(","),
    html: `<div class="stack-lg">
      ${headerHTML("카드 내기")}
      <div class="clue-banner">
        <p class="dim" style="font-size:13px">${esc(playerName(stPid()))} 님의 힌트</p>
        <p class="clue-text">“${esc(M.clue)}”</p>
      </div>
      <h2>힌트에 어울리는 카드를 내세요</h2>
      ${cardGridHTML(hand)}
    </div>`,
    bind() {
      document.querySelectorAll(".card-slot").forEach(el => {
        el.onclick = () => {
          const id = +el.dataset.card;
          showPreview(id, "이 카드 내기", async () => {
            await subDoc(L.room, L.pid).set({ round: M.round, card: id });
            SUBS[L.pid] = { round: M.round, card: id };
            checkAdvance();
            render();
          });
        };
      });
    },
  };
}

function viewWaitPick() {
  const subs = subsThisRound();
  return {
    key: "wait-pick:" + M.round + ":" + JSON.stringify(subs),
    html: `<div class="stack-lg">
      ${headerHTML("카드 모으는 중")}
      <div class="clue-banner"><p class="clue-text">“${esc(M.clue)}”</p></div>
      <h2>${isSt() ? "모두가 카드를 내는 중…" : "카드를 냈어요! 잠시만요"}</h2>
      ${progressHTML(subs, nonStPlayers(), "제출 완료")}
    </div>`,
  };
}

function viewVote() {
  const own = M.subsMap[L.pid];
  return {
    key: "vote:" + M.round + ":" + M.tableOrder.join(","),
    html: `<div class="stack-lg">
      ${headerHTML("투표")}
      <div class="clue-banner"><p class="clue-text">“${esc(M.clue)}”</p></div>
      <div class="stack" style="gap:6px">
        <h2>이야기꾼의 카드는 어느 것일까요?</h2>
        <p class="dim" style="font-size:14px">내가 낸 카드에는 투표할 수 없어요.</p>
      </div>
      ${cardGridHTML(M.tableOrder, id => id === own ? `<span class="card-tag">내 카드</span>` : "")}
    </div>`,
    bind() {
      document.querySelectorAll(".card-slot").forEach(el => {
        const id = +el.dataset.card;
        if (id === own) { el.style.opacity = ".45"; el.onclick = () => showPreview(id, null); return; }
        el.onclick = () => {
          showPreview(id, "이 카드에 투표", async () => {
            await voteDoc(L.room, L.pid).set({ round: M.round, card: id });
            VOTES[L.pid] = { round: M.round, card: id };
            checkAdvance();
            render();
          });
        };
      });
    },
  };
}

function viewWaitVote() {
  const votes = votesThisRound();
  return {
    key: "wait-vote:" + M.round + ":" + JSON.stringify(votes),
    html: `<div class="stack-lg">
      ${headerHTML("개표 기다리는 중")}
      <div class="clue-banner"><p class="clue-text">“${esc(M.clue)}”</p></div>
      <h2>${isSt() ? "모두가 내 카드를 찾는 중…" : "투표했어요! 다른 사람을 기다려요"}</h2>
      ${progressHTML(votes, nonStPlayers(), "투표 완료")}
    </div>`,
  };
}

function viewReveal() {
  const votes = M.result.votes;
  const voters = nonStPlayers().map(p => p.id);
  const correct = voters.filter(v => votes[v] === M.stCard);
  const allOrNone = correct.length === 0 || correct.length === voters.length;
  const ownerOf = id => {
    const entry = Object.entries(M.subsMap).find(([, c]) => c === id);
    return entry ? playerName(entry[0]) : "?";
  };
  const ownerPid = id => {
    const entry = Object.entries(M.subsMap).find(([, c]) => c === id);
    return entry ? entry[0] : null;
  };
  const votersOf = id => voters.filter(v => votes[v] === id).map(v => playerName(v));
  const summary = allOrNone
    ? (correct.length === 0
      ? "아무도 이야기꾼의 카드를 찾지 못했어요! 이야기꾼 0점, 나머지 모두 +2점."
      : "전원이 정답을 맞혔어요! 힌트가 너무 쉬웠네요. 이야기꾼 0점, 나머지 모두 +2점.")
    : `${correct.length}명이 정답을 맞혔어요! 이야기꾼과 정답자는 +3점.`;
  return {
    key: "reveal:" + M.round,
    html: `<div class="stack-lg">
      ${headerHTML("결과 공개")}
      <div class="clue-banner">
        <p class="clue-text">“${esc(M.clue)}”</p>
        <p class="dim" style="font-size:14px; padding-top:6px">${summary}</p>
      </div>
      <div class="card-grid">${M.tableOrder.map(id => `
        <div class="card-slot ${id === M.stCard ? "selected" : ""}" style="cursor:default">
          ${cardArt(id)}
          ${id === M.stCard ? `<span class="hit-badge">정답</span>` : ""}
          <div class="vote-chips">${votersOf(id).map(n => `<span class="vote-chip">${esc(n)}</span>`).join("")}</div>
          <span class="card-tag ${id === M.stCard ? "owner-st" : ""}">${esc(ownerOf(id))}${ownerPid(id) === L.pid ? " (나)" : ""}</span>
        </div>`).join("")}
      </div>
      <p class="reveal-note">카드 위 분홍 칩은 그 카드에 투표한 사람이에요. 남의 표를 받은 카드는 표당 +1점.</p>
      ${scoreBoardHTML(M.result.deltas)}
      <button class="btn" id="next-btn">다음 라운드</button>
    </div>`,
    bind() {
      document.getElementById("next-btn").onclick = () => {
        tryTransition("reveal", M.round, g => nextRoundState(g), 5);
      };
    },
  };
}

function viewEnd() {
  const top = Math.max(...M.players.map(p => M.scores[p.id] || 0));
  const winners = M.players.filter(p => (M.scores[p.id] || 0) === top).map(p => p.name);
  const isHost = M.host === L.pid;
  return {
    key: "end",
    html: `<div class="stack-lg" style="padding-top: 24px;">
      <header class="stack" style="text-align:center;">
        ${moonMark()}
        <p class="eyebrow">게임 종료</p>
        <h1>${esc(winners.join(", "))} 승리!</h1>
        <p class="dim">${M.round}라운드 동안의 멋진 이야기였어요.</p>
      </header>
      ${scoreBoardHTML(null)}
      ${isHost ? `<button class="btn" id="again-btn">같은 멤버로 한 판 더</button>` : `<p class="dim" style="text-align:center; font-size:14px">방장이 다음 판을 시작할 수 있어요.</p>`}
      <button class="btn btn-ghost" id="leave-btn">방 나가기</button>
    </div>`,
    bind() {
      const again = document.getElementById("again-btn");
      if (again) again.onclick = async () => {
        const ref = roomDoc(L.room);
        const lock = await ref.acquire({ holder: L.pid, ttlMs: 1500 });
        if (!lock.acquired) { toast("잠시 후 다시 눌러주세요."); return; }
        const snap = await ref.get();
        if (!snap.exists || snap.data().status !== "end") return;
        const g = snap.data();
        await ref.set(freshGameState(shuffle(g.players.slice()), g.host));
      };
      document.getElementById("leave-btn").onclick = () => leaveRoom();
    },
  };
}

/* ---------- 시작 ---------- */
async function main() {
  loadLocal();
  render(`<div class="center-screen">${moonMark(false, true)}<p class="dim">달빛을 모으는 중…</p></div>`);
  db = await window.claude.use("db");
  lastRenderKey = "";
  if (db && L.room) {
    // 마지막 방에 자동 재입장 시도
    try {
      const snap = await roomDoc(L.room).get();
      if (snap.exists) { watchRoom(L.room); render(); return; }
    } catch (e) {}
    L.room = null; saveLocal();
  }
  render();
}
main();
</script>
</body>
</html>
